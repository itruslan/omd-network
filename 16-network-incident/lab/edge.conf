# Пограничный узел магазина shop.example.com: кэш и фильтр запросов перед
# кластером. Учебная замена CDN с WAF: поля журнала — переменные nginx.

worker_processes 2;
error_log /var/log/edge/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    server_tokens off;

    # Одна строка JSON на запрос. Поля upstream_* пусты, если запрос к
    # источнику не уходил: ответил кэш или сам пограничный узел.
    log_format edge escape=json
        '{"time":"$time_iso8601","request_id":"$request_id",'
        '"client":"$remote_addr","method":"$request_method","uri":"$request_uri",'
        '"request_length":$request_length,"status":$status,"bytes_sent":$bytes_sent,'
        '"request_time":$request_time,"cache":"$upstream_cache_status",'
        '"upstream_addr":"$upstream_addr","upstream_status":"$upstream_status",'
        '"upstream_response_time":"$upstream_response_time",'
        '"waf_rule":"$waf_rule","waf_action":"$waf_action"}';
    access_log /var/log/edge/access.log edge;

    proxy_cache_path /var/cache/edge levels=1:2 keys_zone=edge:10m max_size=50m inactive=10m;

    # Правила фильтра: переменные $waf_rule и $waf_action.
    include /etc/nginx/edge/waf.conf;

    upstream storefront {
        server @NODE1@:30080;
        server @NODE2@:30080;
    }
    upstream checkout {
        server @NODE1@:30081;
        server @NODE2@:30081;
    }

    server {
        listen 80;
        server_name shop.example.com;

        add_header X-Request-Id $request_id always;
        add_header X-Edge-Cache $upstream_cache_status always;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 3s;
        proxy_read_timeout 20s;

        location = /catalog {
            proxy_cache edge;
            proxy_pass http://storefront;
        }
        location = /search {
            if ($waf_action = block) { return 403; }
            proxy_pass http://storefront;
        }
        location = /api/checkout {
            if ($waf_action = block) { return 403; }
            proxy_pass http://checkout;
        }
    }

    server {
        listen 127.0.0.1:8081;
        access_log off;
        location = /status { stub_status; }
    }
}
