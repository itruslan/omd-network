# Набор sqli-lite: признаки внедрения SQL в строке запроса.
map $args $waf_rule {
    default "";
    "~*(union|drop|delete)(\+|%20)+(select|table|from)" "sqli-lite-001";
    "~*(%27|')(\+|%20)*or(\+|%20)+1(%3D|=)1"            "sqli-lite-002";
}
map $waf_rule $waf_action {
    default block;
    ""      "";
}
