worker_processes 1;
daemon on;
error_log /run/dn7-lab/error.log warn;
pid /run/dn7-lab/nginx.pid;

events {
    worker_connections 64;
}

http {
    default_type text/plain;

    # Формат журнала выбран под задачу главы: по строке видно, что ответил
    # клиенту прокси, к какому бэкенду он ходил и что получил от него.
    log_format lab '$time_iso8601 status=$status '
                   'upstream_addr=$upstream_addr '
                   'upstream_status=$upstream_status '
                   'upstream_response_time=$upstream_response_time '
                   'request_time=$request_time '
                   'host=$host';
    access_log /run/dn7-lab/access.log lab;

    client_body_temp_path /run/dn7-lab/body;
    proxy_temp_path /run/dn7-lab/proxy;
    fastcgi_temp_path /run/dn7-lab/fastcgi;
    uwsgi_temp_path /run/dn7-lab/uwsgi;
    scgi_temp_path /run/dn7-lab/scgi;

    upstream shop_app {
        # max_fails и fail_timeout задают, когда бэкенд считается негодным.
        server 198.51.100.31:8080 max_fails=1 fail_timeout=5s;
        server 198.51.100.32:8080 max_fails=1 fail_timeout=5s;
    }

    server {
        listen 443 ssl;
        server_name shop.lab.example;

        ssl_certificate     /run/dn7-lab/tls/server.crt;
        ssl_certificate_key /run/dn7-lab/tls/server.key;

        location / {
            proxy_pass http://shop_app;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Короткие тайм-ауты: сбой должен быть виден за секунды, а не
            # за минуту ожидания.
            proxy_connect_timeout 2s;
            proxy_read_timeout 3s;
        }
    }

    server {
        listen 80;
        server_name shop.lab.example;

        location / {
            proxy_pass http://shop_app;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 2s;
            proxy_read_timeout 3s;
        }
    }
}
